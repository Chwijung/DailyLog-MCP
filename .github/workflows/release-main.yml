name: Release Drafter (Version Management)

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  create_release:
    # PR이 실제로 머지됐을 때만 실행 (단순 close는 제외)
    if: github.event.pull_request.merged == true
    permissions:
      contents: write # 릴리즈 발행
      pull-requests: write # release-drafter가 PR 정보 접근
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # 전체 히스토리(태그 확인용)

      # 버전의 기준은 package.json이다. main은 보호 규칙 때문에 봇이 버전 커밋을 push할 수 없다.
      # 이미 발행된 버전이면 여기서 멈추므로, 재실행해도 릴리즈가 더 생기지 않는다.
      - name: Check package.json version
        id: version
        run: bash .github/scripts/check-release-version.sh

      - name: Create and Publish Release
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter-config.yml
          version: ${{ steps.version.outputs.version }}
          tag: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
